<!DOCTYPE html>
<html>
<head>
  <title>Bagikan Lokasi</title>
</head>
<body>
  <h2>Bagikan Lokasi Kamu</h2>
  <button onclick="getLocation()">Bagikan Lokasi</button>
  <p id="hasil"></p>

  <script>
    function getLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(showPosition);
      } else {
        document.getElementById("hasil").innerHTML = "Browser tidak mendukung lokasi";
      }
    }

    function showPosition(position) {
      let lat = position.coords.latitude;
      let lon = position.coords.longitude;
      document.getElementById("hasil").innerHTML =
        "Lokasi: <a href='https://www.google.com/maps?q=" + lat + "," + lon + "' target='_blank'>Lihat di Maps</a>";
    }
  </script>
</body>
</html>
